# Dependabot: revisa las dependencias de npm de web/ y abre un pull request cuando hay versiones nuevas
# o se publica una vulnerabilidad. Las actualizaciones chicas (minor y patch) llegan juntas en un solo PR
# por semana para no llenar el repo de PRs; las mayores (que pueden romper cosas) llegan de a una.
# Antes de mergear: que el build de Cloudflare pase y probar el sitio (ver "Seguridad" en CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Cordoba
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    # @types/node describe la versión de Node que corre el sitio (web/.nvmrc, la que usa Cloudflare para compilar).
    # Si los tipos fueran más nuevos, se podrían usar funciones que esa versión no tiene. Los saltos mayores se hacen
    # a mano y junto con .nvmrc; Dependabot solo ofrece arreglos dentro de la misma versión mayor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Las actions del CI (.github/workflows/): actions/checkout, actions/setup-node. El directorio "/" es la raíz del
  # repo; Dependabot busca solo los workflows en .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Cordoba
    groups:
      actions:
        patterns: ["*"]
