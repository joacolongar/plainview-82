<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícono: el bloque rojo del 8:2 (generado desde el logo del 8:2). El apple-touch-icon es el de la pantalla de inicio del iPhone -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Color de la barra del navegador en el celular: el fondo de la marca (--color-ink). Acá no llegan los tokens de CSS -->
    <meta name="theme-color" content="#0e0d0b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Título, descripción y Open Graph (la vista previa al compartir el link). Estos son los de la portada: en cada
         página, functions/_middleware.ts les cambia el content en el servidor (WhatsApp e Instagram no ejecutan JS) -->
    <title>THE PLAINVIEW — remeras con cine adentro</title>
    <meta name="description" content="El diario de Plainview 8:2: una edición nueva cada día, un aviso por remera y pasatiempos de cine. Watch closer." />
    <meta property="og:site_name" content="THE PLAINVIEW · Plainview 8:2" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plainview-82.pages.dev/" />
    <meta property="og:title" content="THE PLAINVIEW — remeras con cine adentro" />
    <meta property="og:description" content="El diario de Plainview 8:2: una edición nueva cada día, un aviso por remera y pasatiempos de cine. Watch closer." />
    <meta property="og:image" content="https://plainview-82.pages.dev/og/portada.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cabecera del diario THE PLAINVIEW con los bloques rojos de Watch closer y 8:2" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- La foto de la remera de tapa (lo más grande de la primera pantalla de la portada): anunciada acá, el navegador la
         pide junto con el JS en vez de esperar a que React la pinte. functions/_middleware.ts pone la del día y la saca
         en las demás páginas -->
    <link rel="preload" as="image" href="/portada/what-do-kids-know-vuelta.webp" fetchpriority="high" data-tapa />
    <!-- Tipografías de época: cabecera gótica, titulares condensados y texto del siglo XIX; IM Fell para los pecados
         (ambientación de Policiales). Solo los pesos que se usan: el navegador baja cada fuente recién cuando la página la usa -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Las tipografías de la primera pantalla (cabecera, titulares y texto: normal, negrita e itálica), anunciadas para
         que lleguen antes del primer dibujo: si llegan después, el texto se rearma y la página salta (CLS de 0,23 a 0).
         Son los archivos que da el CSS de Google de abajo: si se cambia una tipografía o Google cambia la versión (v22…),
         copiar las URL nuevas del CSS (si no coinciden, se bajan dos veces) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/unifrakturmaguntia/v22/WWXPlieVYwiGNomYU-ciRLRvEmK7oaVemGZMFABK1Q.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm3Kz-C8CSKlv.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/oldstandardtt/v22/MwQubh3o1vLImiwAVvYawgcf2eVeqlq4ZnRSZw.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/oldstandardtt/v22/MwQrbh3o1vLImiwAVvYawgcf2eVWEX-tS1ZfTc4PlA.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/oldstandardtt/v22/MwQsbh3o1vLImiwAVvYawgcf2eVer2q6bHNwZcQH.woff2" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&family=IM+Fell+English:ital@1&family=IM+Fell+English+SC&display=swap"
    />
  </head>

    <div id="root"></div>

</html>
